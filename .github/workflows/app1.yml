name: app1

on:
  push:
    branches: [main]
    paths: ["apps/app1/**", "charts/hello-app/**", ".github/workflows/_deploy-app.yml", ".github/workflows/app1.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-app.yml
    with:
      app: app1
    secrets: inherit
