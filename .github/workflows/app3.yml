name: app3

on:
  push:
    branches: [main]
    paths: ["apps/app3/**", "apps/namespace.yaml", ".github/workflows/_deploy-app.yml", ".github/workflows/app3.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-app.yml
    with:
      app: app3
    secrets: inherit
