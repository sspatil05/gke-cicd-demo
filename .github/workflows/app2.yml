name: app2

on:
  push:
    branches: [main]
    paths: ["apps/app2/**", "charts/hello-app/**", ".github/workflows/_deploy-app.yml", ".github/workflows/app2.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-app.yml
    with:
      app: app2
    secrets: inherit
