# Reusable workflow: build an app image, push to Artifact Registry, deploy to the dev GKE cluster with Helm.
name: deploy-app (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: App folder name under apps/ (app1, app2, app3)
        required: true
        type: string

env:
  PROJECT_ID: enterprise-ci-cd-ai
  REGION: asia-south1
  REPOSITORY: apps # Artifact Registry repo
  CLUSTER: dev-gke-cluster
  CLUSTER_LOCATION: asia-south1-a
  NAMESPACE: dev
  CHART: charts/hello-app

permissions:
  contents: read
  id-token: write # Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE_REPO=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${{ inputs.app }}
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          docker build -t "$IMAGE_REPO:$IMAGE_TAG" apps/${{ inputs.app }}
          docker push "$IMAGE_REPO:$IMAGE_TAG"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.CLUSTER_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint ${CHART} -f apps/${{ inputs.app }}/values-dev.yaml \
            --set image.repository=${IMAGE_REPO} --set image.tag=${IMAGE_TAG}

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ inputs.app }} ${CHART} \
            --namespace ${NAMESPACE} --create-namespace \
            -f apps/${{ inputs.app }}/values-dev.yaml \
            --set image.repository=${IMAGE_REPO} \
            --set image.tag=${IMAGE_TAG} \
            --atomic --wait --timeout 5m
          kubectl -n ${NAMESPACE} get svc ${{ inputs.app }}
